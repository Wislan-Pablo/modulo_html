<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso HTML5 EBAC</title>
</head>

<body>
    <h1>Formulário de Cadastro</h1>
    <form>
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="informe seu nome...">
        <br />
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="Ex: joaquim@hotmail.com">
        <br />
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha">
        <br />
        <button type="submit" id="Cadastrar">Enviar</button>
    </form>
</body>

</html>
